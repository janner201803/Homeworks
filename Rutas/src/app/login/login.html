<div class="contenedor">

  <div class="login">

    <h1>Iniciar Sesión</h1>

    <div class="grupo">

      <label for="email">
        Email
      </label>

      <input
        id="email"
        type="email"
        [(ngModel)]="email"
        placeholder="Ingrese su email"
      />

    </div>

    <div class="grupo">

      <label for="password">
        Contraseña
      </label>

      <input
        id="password"
        type="password"
        [(ngModel)]="password"
        placeholder="Ingrese su contraseña"
        (keyup.enter)="iniciarSesion()"
      />

    </div>

    <button
      (click)="iniciarSesion()"
    >
      Iniciar Sesión
    </button>

    @if (mensaje) {

      <p class="mensaje">
        {{ mensaje }}
      </p>

    }

    <div class="datos">

      <p>
        <strong>Email:</strong>
        user@mail.com
      </p>

      <p>
        <strong>Contraseña:</strong>
        123
      </p>

    </div>

  </div>

</div>
