<div class="contenedor">

  <h1>Buscador de GIFs</h1>

  <p>Encuentra tus GIFs favoritos con GIPHY</p>

  <div class="buscador">

    <input
      type="text"
      [(ngModel)]="busqueda"
      (ngModelChange)="programarBusqueda()"
      placeholder="¿Qué GIF deseas buscar?"
    >

    <button (click)="buscar()">
      Buscar
    </button>

  </div>

  @if (cargando) {
    <p class="mensaje">Buscando GIFs...</p>
  }

  @if (error) {
    <p class="mensaje">{{ error }}</p>
  }

  <div class="resultados">

    @for (gif of gifs; track gif.id) {

      <div class="tarjeta">

        <img
          [src]="gif.images.fixed_height.url"
          [alt]="gif.title"
        >

      </div>

    }

  </div>

</div>
