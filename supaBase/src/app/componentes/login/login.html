<main class="auth-card">
  <div class="marca" aria-hidden="true">S</div>
  <p class="eyebrow">Tu espacio de trabajo</p>
  <h1>Qué bueno verte</h1>
  <p class="intro">Inicia sesión para continuar con tus tareas.</p>

  <form (ngSubmit)="iniciarSesion()" #formulario="ngForm">
    <label for="correo">Correo electrónico</label>
    <input
      id="correo"
      type="email"
      name="correo"
      [(ngModel)]="correo"
      placeholder="tu@correo.com"
      autocomplete="email"
      required
      email
    />

    <label for="password">Contraseña</label>
    <input
      id="password"
      type="password"
      name="password"
      [(ngModel)]="password"
      placeholder="Tu contraseña"
      autocomplete="current-password"
      required
    />

    <button class="boton-principal" type="submit" [disabled]="formulario.invalid || cargando">
      {{ cargando ? 'Ingresando...' : 'Iniciar sesión' }}
    </button>
  </form>

  <p class="mensaje" aria-live="polite" *ngIf="mensaje">{{ mensaje }}</p>

  <p class="pie-auth">¿Primera vez aquí? <a routerLink="/registro">Crea una cuenta</a></p>
</main>
