<div class="container">

  <header class="header">
    <h1>Smart Search</h1>
    <p>Buscador inteligente de productos</p>
    <span>Trie + Max Heap</span>
  </header>

  <section class="card">

    <h2>Agregar producto</h2>

    <div class="form-group">

      <label>Nombre del producto</label>

      <input
        type="text"
        [(ngModel)]="nombre"
        placeholder="Ejemplo: air max"
      >

    </div>

    <div class="form-group">

      <label>Popularidad (0 - 100)</label>

      <input
        type="number"
        [(ngModel)]="popularidad"
        min="0"
        max="100"
      >

    </div>

    <button class="btn-primary" (click)="agregarProducto()">
      Agregar producto
    </button>

  </section>

  <section class="card">

    <h2>Buscar productos</h2>

    <div class="form-group">

      <label>Prefijo de búsqueda</label>

      <input
        type="text"
        [(ngModel)]="prefijo"
        placeholder="Ejemplo: air"
        (keyup.enter)="buscar()"
      >

    </div>

    <div class="form-group">

      <label>Cantidad de resultados (K)</label>

      <input
        type="number"
        [(ngModel)]="cantidad"
        min="1"
      >

    </div>

    <div class="buttons">

      <button class="btn-primary" (click)="buscar()">
        Buscar
      </button>

      <button class="btn-secondary" (click)="limpiar()">
        Limpiar
      </button>

    </div>

    <p class="message">{{ mensaje }}</p>

  </section>

  <app-resultados
    [resultados]="resultados">
  </app-resultados>

  <app-productos
    [productos]="productos">
  </app-productos>

</div>
